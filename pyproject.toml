[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ovc"
dynamic = ["version"]
description = "Find overlaps and gaps in polygon layers from a map, the command line or Python, plus building and road QC"
requires-python = ">=3.10"

authors = [
  { name = "Ammar Yasser Abdalazim" }
]

readme = "README.md"
license = { file = "LICENSE" }

keywords = [
  "GIS",
  "OpenStreetMap",
  "Quality Control",
  "Geospatial",
  "Buildings"
]

classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: GIS",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12"
]

dependencies = [
  "geopandas>=1.0,<2.0",
  "shapely>=2.0,<3.0",
  "pyproj>=3.6,<4.0",
  "pandas>=2.0,<3.0",
  "folium>=0.15,<1.0",
  "pyogrio>=0.7",
  "fiona>=1.9,<2.0",
  "rtree>=1.1,<2.0",
  "geoqa",
]

[project.optional-dependencies]
# OVC in its own desktop window instead of a browser tab
window = [
  "pywebview>=5.0",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.0",
  "pre-commit>=3.0",
]

[project.urls]
Homepage = "https://github.com/AmmarYasser455/ovc"
Issues = "https://github.com/AmmarYasser455/ovc/issues"

[project.scripts]
ovc = "ovc.cli:main"

[project.gui-scripts]
ovc-gui = "ovc.app.launcher:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["ovc*"]

[tool.setuptools.dynamic]
version = { attr = "ovc.__version__" }

[tool.setuptools.package-data]
"ovc.app" = ["static/*", "static/vendor/leaflet/*", "static/vendor/leaflet/images/*"]
"ovc.sample_data" = ["*.gpkg"]

